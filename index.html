<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu de la Semaine</title>
<meta name="description" content="Déjeuners et dîners de la semaine pour 2 personnes, avec la liste de courses classée par rayon.">
<meta name="theme-color" content="#C9931A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menu">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 7h13M13 3l4 4-4 4M20 17H7M11 13l-4 4 4 4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-basket" viewBox="0 0 24 24"><path d="M3 10h18l-1.6 9a2 2 0 0 1-2 1.6H6.6a2 2 0 0 1-2-1.6L3 10zM8 10l3-6M16 10l-3-6M9 14v3M15 14v3"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5zM4 21a2 2 0 0 1 2-2h13"/><path d="M8 7h7"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div>
      <h1>Menu de la <em>Semaine</em></h1>
      <p class="week-label" id="weekLabel"></p>
    </div>
    <div class="serves" role="group" aria-label="Nombre de personnes" title="Les quantités s'ajustent au nombre de personnes">
      <button class="serves-btn" data-act="personsMinus" aria-label="Une personne de moins">−</button>
      <span class="serves-label" id="servesLabel">2 personnes</span>
      <button class="serves-btn" data-act="personsPlus" aria-label="Une personne de plus">+</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Navigation">
    <div class="tabs-inner" role="tablist">
      <button class="tab" role="tab" data-tab="semaine" aria-selected="true"><svg class="icon"><use href="#i-calendar"/></svg>Semaine</button>
      <button class="tab" role="tab" data-tab="courses" aria-selected="false"><svg class="icon"><use href="#i-basket"/></svg>Courses<span class="tab-count" id="coursesCount" hidden></span></button>
      <button class="tab" role="tab" data-tab="recettes" aria-selected="false"><svg class="icon"><use href="#i-book"/></svg>Recettes</button>
    </div>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
